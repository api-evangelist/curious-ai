name: Curious Ai
description: >-
  The Curious AI Company was a Helsinki, Finland-based artificial intelligence
  research company founded in 2015 by Harri Valpola (previously founder of
  ZenRobotics) along with Antti Rasmus, Mathias Berglund, Tapani Raiko, and
  Timo Haanpaa. The company pursued artificial general intelligence, real-world
  computer vision for robots, and interactive, autonomous, and semi-supervised
  machine learning, and is best known for foundational research on Ladder
  Networks for semi-supervised deep learning. It raised roughly 4.7M USD from
  investors including DCVC, Lifeline Ventures, and Invus, and was acquired by
  Apple in January 2021. The company no longer operates as an independent entity
  and publishes no public developer platform, API, documentation, or SDKs. This
  record is retained as a DCVC portfolio identity profile; there is no active
  API surface to enrich.
